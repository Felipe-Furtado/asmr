<!DOCTYPE html>
<html lang="en" class="{{THEME}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    CSS is inlined below by MarkdownRenderer at render time.
    We do NOT use <link href="styles.css"> because loadHTMLString(_:baseURL:)
    does not reliably grant WKWebView access to load relative file:// resources,
    even with a bundle base URL. Inlining makes the page fully self-contained.
  -->
  <style>{{STYLES}}</style>
  <title>ASMR</title>
</head>
<body>
  <article class="markdown-body">
    {{CONTENT}}
  </article>
</body>
</html>
